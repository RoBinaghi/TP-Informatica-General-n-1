<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/estilo.css">
    <title>Juego de cartas</title>
</head>
<body>
  <div id="contenedor">
   
<header><nav>
    <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="dados.html">Juego de dados</a></li>
        <li><a href="preguntas.html">Juego de preguntas</a></li>
        <li><a href="cartas.html">Juego de cartas</a></li>
        <li><a href="puntaje.html">Puntaje</a></li>
        <li><a href="proyecto.html">Sobre el proyecto</a></li>
    </ul>    
 </nav>
 </header>
 <main>
   <h1>Juego de cartas</h1>
<!-- Seleccionar si se juega con gente o solo -->
<div id="pasoModo">
  <label>¿Jugás solo o con alguien?</label><br>
  <button type="button" id="jugarContraCompu">Jugar contra la computadora</button>
  <button type="button" id="jugarConParticipantes">Jugar con más participantes</button>
</div>

<!-- Ingresar datos de cantidad -->
<form id="ingresoDatos2" hidden>
  <label>¿Cuántos participantes son?</label>
  <input type="number" name="cantidadParticipantes" id="cantidadParticipantes" min="2"><br>
  <button type="button" id="ingresarCantidad">Ingresar cantidad</button>
</form>

<!-- Ingresar datos de nombre -->
<form id="ingresoDatos3" hidden>
  <label id="nombreNumero">Nombre del participante</label>
  <input type="text" name="nombreJugador" id="nombreJugador"><br>
  <button type="button" id="ingresarNombre">Ingresar Nombre</button>
</form>

<!-- Inicio de juego -->
<div id="pasoJuego" hidden>
  <h2 id="turnoJugador">Turno de: </h2>
  <p id="mensajeJuego">¡Selecciona una carta de tu mano para jugar!</p>

  <!-- TABLERO CENTRAL (Mesa en el centro + Casitas a los costados) -->
  <div class="tablero-central">

    <!-- Panel Central: Mesa -->
    <div class="mesa-seccion">
      <h3>Mesa</h3>
      <div id="mesa" class="mesa-container"></div>
      <button type="button" id="tirarAMesa">Tirar carta seleccionada a la mesa</button>
    </div>

    <!-- Panel Lateral: Casitas del jugador y competidores -->
    <div class="casitas-seccion">
      <h3>Casitas</h3>
      <div id="contenedorCasitas"></div>
    </div>

  </div>

  <!-- SECCIÓN INFERIOR: Mano del jugador activo -->
  <div class="mano-seccion">
    <h3>Tu Mano</h3>
    <div id="mano" class="mano-container"></div>
  </div>
</div>

 </main>
 <footer>
 </footer>
 </div>
  <script src="js/cartas.js"></script>
</body>
</html>
